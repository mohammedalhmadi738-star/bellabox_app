name: bellabox
description: "Bella Box - Luxury Beauty Store"
publish_to: 'none'
version: 1.0.0+1

environment:
  # withValues(alpha:) requires Dart 3.6 / Flutter 3.27+
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0

  # Functional
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Utils
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
